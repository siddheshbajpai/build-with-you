<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Build with YOU — responsive harness</title>
<style>
  body { margin:0; background:#1b1b1b; font-family: monospace; color:#8f8; }
  .row { display:flex; gap:14px; padding:10px; align-items:flex-start; }
  .lbl { padding:2px 0; font-size:12px; }
  .holder { width:770px; height:500px; overflow:hidden; border:2px solid #0f0; }
  .holder iframe { border:0; width:1400px; height:900px; transform:scale(0.55); transform-origin: top left; display:block; }
  .m-holder { width:420px; height:740px; overflow:hidden; border:2px solid #f0f; }
  .m-holder iframe { border:0; width:390px; height:760px; display:block; }
</style>
</head>
<body>
<div class="row">
  <div>
    <div class="lbl">DESKTOP 1400 (scaled)</div>
    <div class="holder"><iframe id="f1" src="/index.html"></iframe></div>
  </div>
  <div>
    <div class="lbl">MOBILE 390</div>
    <div class="m-holder"><iframe id="f3" src="/index.html"></iframe></div>
  </div></div>
</body>
</html>
